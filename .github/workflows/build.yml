name: Build Mouse.exe

on:
  workflow_dispatch:
  push:
    branches: [main, feature/redesign-gui]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name Mouse Mouse.py

      - name: Upload Mouse.exe
        uses: actions/upload-artifact@v4
        with:
          name: Mouse
          path: dist/Mouse.exe
